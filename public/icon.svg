<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="50%" stopColor="#EA580C" />
      <stop offset="100%" stopColor="#C2410C" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="50%" stopColor="#FACC15" />
      <stop offset="100%" stopColor="#CA8A04" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDA4AF" />
      <stop offset="100%" stopColor="#DC2626" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with aura -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="#FEF3C7" opacity="0.25" />
  <circle cx="256" cy="256" r="170" fill="#FEF08A" opacity="0.35" />

  <!-- Sacred ॐ Emblem at Top -->
  <text x="256" y="110" font-family="sans-serif" font-size="52" font-weight="900" fill="#FEF3C7" text-anchor="middle">ॐ</text>

  <!-- Bal Hanuman Golden Mukut (Crown) -->
  <path d="M 160 270 Q 256 250 352 270 L 360 220 L 310 230 L 256 150 L 202 230 L 152 220 Z" fill="url(#crownGrad)" stroke="#B45309" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Crown Ruby & Gems -->
  <circle cx="256" cy="205" r="16" fill="url(#rubyGrad)" stroke="#FEF08A" stroke-width="4" />
  <circle cx="205" cy="225" r="9" fill="url(#rubyGrad)" />
  <circle cx="307" cy="225" r="9" fill="url(#rubyGrad)" />

  <!-- Sacred Tilak -->
  <path d="M 246 280 C 246 320 256 335 256 335 C 256 335 266 320 266 280" stroke="#DC2626" stroke-width="8" stroke-linecap="round" fill="none" />
  <circle cx="256" cy="305" r="5" fill="#FBBF24" />

  <!-- Golden Gada (Mace) Across Bottom -->
  <g transform="rotate(35 256 380)">
    <line x1="160" y1="380" x2="350" y2="380" stroke="url(#crownGrad)" stroke-width="16" stroke-linecap="round" />
    <circle cx="350" cy="380" r="38" fill="url(#crownGrad)" stroke="#854D0E" stroke-width="4" />
    <circle cx="350" cy="380" r="10" fill="url(#rubyGrad)" />
  </g>

  <!-- Text Kicker -->
  <text x="256" y="465" font-family="sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BAL HANUMAN</text>
</svg>
